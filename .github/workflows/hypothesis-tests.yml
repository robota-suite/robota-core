# Run Hypothesis property-based tests.
#
# This workflow installs the project dependencies (including the hypothesis
# test dependency) and runs only the property-based test suite.  It is kept
# separate from the main build/lint/test workflow so that Hypothesis failures
# are easy to spot and so that the number of generated examples can be
# tuned independently for CI.
#
# Hypothesis settings used in CI
# --------------------------------
# The HYPOTHESIS_PROFILE environment variable is set to "ci".  The test
# module registers a "ci" profile with:
#   - max_examples = 50   (keep runs short; increase locally to find more bugs)
#   - suppress_health_check = [too_slow]
#   - verbosity = verbose  (every generated example is printed to the log)
#
# The verbose output means that every attempt Hypothesis makes is visible in
# the Actions log, which helps diagnose failures without needing to reproduce
# them locally.

name: Hypothesis Property-Based Tests

on:
  push:
    branches: [ "develop" ]

  pull_request:
    branches: [ "develop" ]

  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  hypothesis:

    runs-on: ubuntu-latest

    env:
      # Activate the "ci" Hypothesis settings profile defined in the test module.
      HYPOTHESIS_PROFILE: ci

    steps:
    - uses: actions/checkout@v4

    - name: Install toml for reading pyproject.toml
      run: pip install toml

    - name: Set Python version from workflow input or pyproject.toml
      id: python-version
      run: |
        if [[ "${{ github.event.inputs.python-version }}" != "" ]]; then
          PYTHON_VERSION="${{ github.event.inputs.python-version }}"
        else
          PYTHON_VERSION=$(python3 -c 'import toml; pyproject = toml.load("pyproject.toml"); print(pyproject.get("project", {}).get("requires-python", "3.11").strip(">="))')
        fi
        echo "PYTHON_VERSION=$PYTHON_VERSION" >> $GITHUB_ENV
        echo "version=$PYTHON_VERSION" >> $GITHUB_OUTPUT

    - name: Set up Python ${{ steps.python-version.outputs.version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python-version.outputs.version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with test

    - name: Run Hypothesis property-based tests
      run: |
        poetry run python -m pytest robota_core/tests/test_hypothesis_properties.py \
          -v -s \
          --tb=short

    - name: Upload Hypothesis examples database
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hypothesis-examples
        path: .hypothesis/examples/
        if-no-files-found: ignore
